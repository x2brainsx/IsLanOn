<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is It Happening?</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0 0 15px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Status Box Styles */
        .status-box {
            font-size: 1.8rem;
            font-weight: bold;
            padding: 12px 35px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Status Colors */
        .status-yes { background-color: #1abd4b; color: #fff; }
        .status-guess { background-color: #ff9f1c; color: #fff; }
        .status-no { background-color: #e71d36; color: #fff; }

        #countdown {
            font-size: 2.5rem;
            font-weight: bold;
            font-family: monospace;
            background: #222;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
        }

        .custom-message {
            font-size: 1.2rem;
            color: #aaa;
            max-width: 600px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1 id="headline">Is LAN Happening?</h1>

    <!-- 
      STATUS BOX: Change the class below to swap options. 
      Options: 
         - "status-yes"   (Green box)
         - "status-guess" (Orange box)
         - "status-no"    (Red box)
    -->
    <div id="status-badge" class="status-box status-yes">Affirmative, Lan is Always on</div>

    <!-- TARGET DATE DISPLAY: This text updates automatically based on your script variable below -->
	<br>
    <div id="target-time-label" class="target-display">Loading Target Date...</div>

    <div id="countdown">Loading...</div>

    <!-- CUSTOM MESSAGE: Edit your text inside the paragraph tags below -->
    <p class="custom-message">
        Diak says it will always be on, unless something drastic happens that he lets us know about, plus we should be able to get in earlier than usual (25/08/2026)
    </p>

    <script>
        // 1. SET YOUR TARGET DATE AND TIME HERE (Format: YYYY-MM-DDTHH:MM:SS)
        const targetString = "2026-08-28T14:00:00";
        const targetDate = new Date(targetString).getTime();

        // 2. Format and display the text representation of the target date
        const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        const formattedTarget = new Date(targetString).toLocaleString('en-US', options);
        document.getElementById("target-time-label").innerHTML = `Counting down to: ${formattedTarget}`;

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML = 
                `${days}d ${hours}h ${minutes}m ${seconds}s`;

            if (difference < 0) {
                clearInterval(timer);
                document.getElementById("headline").innerHTML = "IT IS HAPPENING!";
                
                // Automatically updates status to YES when countdown finishes
                const badge = document.getElementById("status-badge");
                badge.className = "status-box status-yes";
                badge.innerHTML = "Yes";
                
                document.getElementById("countdown").innerHTML = "00:00:00:00";
                document.getElementById("countdown").style.color = "#2ec4b6";
            }
        }, 1000);
    </script>

</body>
</html>
